services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ESTATISTICA_TEMPO_LIMITE=120
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl","-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
